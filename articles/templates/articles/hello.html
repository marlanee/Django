{% extends "articles/base.html" %}

{% block content %}
        <h1>안녕하세요, {{ nickname }}입니다.</h1>
        <p>저는 {{ goal }}를 만들고 싶습니다.</p>

        <h2>앞으로의 학습 목표</h2>
        <ul>
            {% for goal in goals %}
                <li>{{ goal }}</li>
            {% endfor %}
        </ul>
        {% if not goals %}
            <p>목표를 정해 주세요.</p>
        {% endif %}
{% endblock content %}
